installed: []
settings:
  auto_execute_hooks: true
hooks:
  before_plan:
  - extension: vnr-wiki
    command: vnr-wiki
    enabled: true
    optional: false
    prompt: Nạp context nghiệp vụ từ wiki dự án trước khi lập kế hoạch?
    description: >-
      Nạp context docs/wiki/ (entities, concepts, workflows) để kế hoạch triển khai
      bám đúng kiến thức nghiệp vụ. Nếu wiki chưa có nội dung thì dùng docs/raw/.
    condition: null

  before_implement:
  - extension: vnr-wiki
    command: vnr-wiki
    enabled: true
    optional: false
    prompt: Nạp context nghiệp vụ từ wiki dự án trước khi triển khai?
    description: >-
      Nạp context docs/wiki/ trước khi viết mã: entities → Domain model,
      concepts → logic Handler. Nếu wiki chưa có nội dung thì dùng docs/raw/.
    condition: null

  after_implement:
  - extension: vnr-wiki-sync
    command: vnr-wiki-sync
    enabled: true
    optional: false
    prompt: Đồng bộ wiki từ tài liệu thô đã cập nhật sau khi triển khai?
    description: >-
      Đồng bộ docs/wiki/ từ docs/raw/ để ghi nhận kiến thức nghiệp vụ mới
      phát sinh trong lúc triển khai tính năng này.
    condition: null
