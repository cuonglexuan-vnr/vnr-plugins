version: "1"
# Định nghĩa các phase của pipeline — được vnr-auto-pipeline/SKILL.md (orchestrator) đọc.
# Mỗi phase có type: skill | agent | parallel | cli
# Orchestrator chỉ truyền: FEATURE, PLUGIN_DIR. Mỗi agent tự đọc tệp .md của mình để có đủ context.
#
# NGÂN SÁCH CỔNG KIỂM SOÁT (quy tắc cứng): tối đa 2 cổng AskUserQuestion tương tác trên luồng thuận lợi —
#   (1) plan-review (luôn có), (2) stack-confirm (CHỈ khi resolver báo có hơn 1 UI stack).
# Mọi cổng kiểm soát PHẢI tự bỏ qua khi không cần: không có manifest / chỉ một stack rõ ràng / kết quả PASS.

phases:
  - id: plan
    name: "Plan"
    type: skill
    skill: vnr-plan

  - id: plan-review
    name: "Plan Review"
    type: agent
    agent: vnr-plan-reviewer
    hitl: true
    hitl_question: "Plan Review đã xong. Xem kết quả và kế hoạch triển khai rồi quyết định."
    hitl_preview_file: "specs/{feature}/plan.md"
    hitl_options:
      - label: "approve"
        description: "Kế hoạch ổn — sang bước Tasks"
      - label: "modify"
        description: "Tôi sẽ tự sửa plan.md rồi mới duyệt"
      - label: "reject"
        description: "Bỏ kế hoạch này, lập lại từ đầu"
    on_reject:
      action: stop
      recovery: "--from=plan"

  - id: tasks
    name: "Tasks"
    type: skill
    skill: vnr-tasks

  - id: testcases
    name: "Testcases"
    type: agent
    agent: vnr-testcase-writer

  - id: implement
    name: "Implement"
    type: skill
    skill: vnr-implement
    gate: build
    on_fail:
      action: stop
      recovery: "--from=implement"

  - id: code-review
    name: "Code Review"
    type: agent
    agent: vnr-code-reviewer
    gate: review
    on_fail:
      action: stop
      recovery: "--from=code-review"

  - id: arch-sec-review
    name: "Arch + Security Review"
    type: parallel
    sub_agents:
      - agent: vnr-arch-reviewer
      - agent: vnr-sec-reviewer
    gate: review
    on_fail:
      action: stop
      recovery: "--from=arch-sec-review"

  - id: e2e-stubs
    name: "E2E Stubs"
    type: agent
    agent: e2e-stubs-inline
    always_pass: true
    # Prompt agent nhúng sẵn (orchestrator dùng prompt này thay vì đọc tệp .md):
    inline_prompt: |
      Read docs/wiki/index.md → find entry tagged `recipe` for E2E setup → discover E2E test file path.
      If wiki has no E2E recipe → use path: specs/{feature}/testcases.md to infer, or default to src/frontend/e2e/{feature}.e2e.spec.ts.

      Check if E2E stub file exists:
      - EXISTS → report "✅ E2E stub exists: <path>"
      - MISSING → create minimal stub:
        import {{ test }} from '@playwright/test';
        // AUTO-STUB — implement body from specs/{feature}/testcases.md (P0+P1)
        test.describe('{feature}', () => {{ test.todo('P0 happy path'); }});
        → report "✅ E2E stub created: <path>"

      This phase always passes regardless of outcome.

  - id: report
    name: "Report"
    type: agent
    agent: vnr-tech-writer
